services:
  - type: web
    name: authentix
    env: docker
    plan: free
    region: oregon
    autoDeploy: true

    # Docker build settings
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Network
    healthCheckPath: /health

    # Runtime environment variables
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEMO_MODE_ACTIVE
        value: "true"
      # Add any secrets below (set values in Render Dashboard → Environment)
      # - key: SECRET_KEY
      #   generateValue: true

    # Persistent disk for model checkpoints and data
    disk:
      name: authentix-data
      mountPath: /app/model_data
      sizeGB: 1
